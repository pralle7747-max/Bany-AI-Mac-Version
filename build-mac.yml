name: Build macOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter google-genai duckduckgo-search pyttsx3 firebase-admin

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --name="Bany AI" mac.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bany-AI-macOS
        path: dist/Bany AI.app
